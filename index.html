<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task App</title>
    <link rel="stylesheet" href="style.css">

    <script defer src="models/task.js"></script>
    <script defer src="models/taskManager.js"></script>
    <script defer src="main.js"></script>

</head>
<body>

    <h1>Task App</h1>

    <form>
        <label>Task Name:
            <input type="text" id="taskName" placeholder="Enter task name" required>
        </label>
        <label>Task Description:
            <input type="text" id="taskDescription" placeholder="Enter task description" required>
        </label>
        <button type="submit">Add Task</button>
    </form>

    <div>
        <label>Filter:
            <select id="filterSelect">
                <option value="all">All</option>
                <option value="complited">Completed</option>
                <option value="notComplited">Not Completed</option>
            </select>
        </label>
    </div>

    <div id="TaskList"></div>


</body>
</html>
