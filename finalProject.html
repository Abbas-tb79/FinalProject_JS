<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TaskApp</title>
    <link rel="stylesheet" href="styleFinProj.css">
    <script type="module" src="main.js"></script>
</head>
<body>

    <h1 style="margin-top: 2rem; margin-left: 5%"><span>Add new  Task</span></h1>
    <br>
    <form id="taskForm" style=" margin-left: 5%">
        <lable>
            Tittle
            <input type="text" placeholder="Enter Task Name">
        </lable>
        <br>
        <lable>
            Description
            <input type="text" placeholder="Enter Task Description" >
        </lable>

        <button class="addSubmit">Add</button>
    </form>

    <div class = "newTask"></div>


    <fieldset style = "margin-top: 2%; width: 20%" >
        <h2 class ="menuView">Menu operation:</h2>

        <button class="buttonOperation">Edit</button>
        <br>
        <button class="buttonOperation">Show</button>
        <br>
        <button class="buttonOperation">Delete</button>
    </fieldset>

</body>
</html>
